[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicenotes"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "pynput>=1.7",
    "numpy>=1.24",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
voicenotes = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
